name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter package
        run: flutter analyze

      - name: Run Flutter tests with coverage
        run: flutter test --coverage

      - name: Report coverage
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "coverage/lcov.info was not generated" >&2
            exit 1
          fi

          lines_found=$(awk -F: '/^LF:/ { total += $2 } END { print total + 0 }' coverage/lcov.info)
          lines_hit=$(awk -F: '/^LH:/ { total += $2 } END { print total + 0 }' coverage/lcov.info)
          coverage_percent=$(awk "BEGIN { if ($lines_found == 0) printf \"0.00\"; else printf \"%.2f\", ($lines_hit / $lines_found) * 100 }")
          q2_target="15.00"
          target_status=$(awk "BEGIN { if ($coverage_percent >= $q2_target) print \"passed\"; else print \"failed\" }")
          badge_color=$(awk "BEGIN { if ($coverage_percent >= 80) print \"brightgreen\"; else if ($coverage_percent >= $q2_target) print \"green\"; else print \"red\" }")
          generated_at=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo "## Test Coverage"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| Lines hit | $lines_hit |"
            echo "| Lines found | $lines_found |"
            echo "| Line coverage | ${coverage_percent}% |"
            echo "| Q2 target | >=${q2_target}% |"
            echo "| Target status | ${target_status} |"
          } >> "$GITHUB_STEP_SUMMARY"

          cat > docs/coverage.md <<EOF
          # Test Coverage

          Latest CI line coverage is **${coverage_percent}%** (${lines_hit}/${lines_found} lines).

          | Metric | Value |
          | --- | ---: |
          | Lines hit | ${lines_hit} |
          | Lines found | ${lines_found} |
          | Line coverage | ${coverage_percent}% |
          | Q2 target | >=${q2_target}% |
          | Target status | ${target_status} |

          Generated from [GitHub Actions run ${GITHUB_RUN_ID}](${run_url}) for commit \`${GITHUB_SHA}\` at ${generated_at}.
          EOF

          cat > docs/coverage.json <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${coverage_percent}%",
            "color": "${badge_color}"
          }
          EOF

          echo "Line coverage: ${coverage_percent}% (${lines_hit}/${lines_found})"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Generate Flutter API docs
        run: dart doc --output docs/tts/doc/api

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      # Temporary compatibility switch while actions/deploy-pages@v4 is being
      # migrated from Node 20 to Node 24 by GitHub.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

site_name: TTS
site_description: Flutter text-to-speech plugin using custom ONNX Runtime models.
repo_url: https://github.com/bookbot-kids/tts
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details

nav:
  - Home: index.md
  - Contributing: contributing.md
  - Changelog: changelog.md
  - Project Charter: project-charter.md
  - Code of Conduct: code-of-conduct.md
  - Open Source QA: open-source-qa.md
  - Flutter API: tts/doc/api/index.html
